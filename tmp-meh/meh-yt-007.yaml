- idx: 1
  title: Theme 1 — اختصرنا علي بعض حاجات كتيره جد
  khu: Segment 00:01 — distilled
  quotes:
  - اختصرنا علي بعض حاجات كتيره جدا الناس دي فاهمه
  - حاجات كتيره جدا من بحثهم الخاص انت شفت ان
- idx: 2
  title: Theme 2 — فيديوتين جرافيك ديزاين وورد بر
  khu: Segment 00:44 — distilled
  quotes:
  - فيديوتين جرافيك ديزاين وورد بريس بروجرامينج اي كذا هم
  - في اكونتس معانا بيدخلوا نفسوا في كل حاجه الله
- idx: 3
  title: Theme 3 — رب العالمين هتتعمل هنخش بكل ال
  khu: Segment 01:27 — distilled
  quotes:
  - رب العالمين هتتعمل هنخش بكل المسارات اللي انتم هتطلبوها
  - تحت هنجاز لكم فيها محتوي واحمد وعدنا هيكون معانا
