meh:
- idx: 1
  title: Theme 1 — معاك كمان وفي امثله كتير جدا ل
  khu: Segment 00:01 — distilled
  quotes:
  - معاك كمان وفي امثله كتير جدا لناس اتحولت من
  - مجالها الاساسي وراحت لشغل الفرينهانس والموضوع ماشي معاهم اخر
- idx: 2
  title: 'Theme 2 — تشتغل هتتفقس علي طول وبالنسبه '
  khu: Segment 00:09 — distilled
  quotes:
  - تشتغل هتتفقس علي طول وبالنسبه للكورسات اللي بنشوفها علي
  - الانترنت انا شايف يعني انها هتكون كويسه جدا لو
- idx: 3
  title: Theme 3 — مثلا 100 دولار كل شهر او كل شه
  khu: Segment 00:17 — distilled
  quotes:
  - مثلا 100 دولار كل شهر او كل شهرين بس
  - هو حاسس برده انه بيضيع وقت بس الحقيقه واللي
