meh:
- idx: 1
  title: Theme 1 — تمام بيقول الصوت واضح تنحنح لو
  khu: Segment 00:01 — distilled
  quotes:
  - تمام بيقول الصوت واضح تنحنح لو الصوت فيه مشكله
  - قولوا لي اركب المايك سد الدنيا حواليا هاديه فقلت
- idx: 2
  title: Theme 2 — الصبح يقول لي انا اتقبلت ليه ا
  khu: Segment 00:54 — distilled
  quotes:
  - الصبح يقول لي انا اتقبلت ليه انت اتقبلت علشان
  - خاطر انا حضرت الكلام اللي انت قلته ما انا
- idx: 3
  title: Theme 3 — مع اول انترفيو عاليه جدا جدا ف
  khu: Segment 01:47 — distilled
  quotes:
  - مع اول انترفيو عاليه جدا جدا فشكرا جدا لكم
  - والناس اللي هي اللي حضرت النهارده العدد كان اكتر
