- idx: 1
  title: Theme 1 — الصفر الي 50 000 جنيه دخل شهري
  khu: Segment 00:01 — distilled
  quotes:
  - الصفر الي 50 000 جنيه دخل شهري طب احنا
  - ليه اصلا عايزين نوصل ل 500 000 جنيه دخل
- idx: 2
  title: Theme 2 — بس ان الحاجات اللي انت بتطلعهم
  khu: Segment 00:25 — distilled
  quotes:
  - بس ان الحاجات اللي انت بتطلعهم من الاي اي
  - عامه دايما تراجع عليها كلمه بكلمه وتقراها بصوت عالي
- idx: 3
  title: Theme 3 — ما اتفرجت في الفيديو ده عشان خ
  khu: Segment 00:50 — distilled
  quotes:
  - ما اتفرجت في الفيديو ده عشان خاطر تشجع غيرك
  - ان اللي هيشوفه لان ان شاء الله انا محتاج
