meh:
- idx: 1
  title: Theme 1 — فيه سمك كتير علشان خاطر تكون ز
  khu: Segment 00:01 — distilled
  quotes:
  - فيه سمك كتير علشان خاطر تكون زي ما تقول
  - ايه فرصتي علي كل ما كان في فرص انا
- idx: 2
  title: Theme 2 — لو ناوي ان انت تشتغل في شركه ك
  khu: Segment 00:06 — distilled
  quotes:
  - لو ناوي ان انت تشتغل في شركه كبيره ان
  - انت تتجه للانجلر لو هو ده تارجتك ولكن اوفر
- idx: 3
  title: Theme 3 — بتبقي رخمه في اي حاجه اصلا بتع
  khu: Segment 00:11 — distilled
  quotes:
  - بتبقي رخمه في اي حاجه اصلا بتعملها فعلشان كده
  - بتقدر ان انت يكون عندك شويه تروم ان انت
